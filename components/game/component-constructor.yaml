components:
  - name: ${NAME}
    version: ${VERSION}
    provider:
      name: github.com/skarlso
    resources:
      - name: image
        type: ociImage
        version: ${VERSION}
        relation: local
        access:
          type: OCIImage/v1
          imageReference: ${IMAGE}:${VERSION}
      - name: helm-chart
        type: helmChart
        relation: local
        input:
          type: Helm/v1
          path: ${CHART_DIR}
