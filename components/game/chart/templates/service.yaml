apiVersion: v1
kind: Service
metadata:
  name: asteroid-run
  labels:
    app.kubernetes.io/name: asteroid-run
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: asteroid-run
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
